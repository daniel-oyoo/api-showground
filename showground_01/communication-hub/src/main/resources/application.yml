server:
  port: 8081

spring:
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:your-gmail-with-2fa-enabled}
    password: ${APP_PASSWORD:your-app-password}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

app:
  twilio:
    account-sid: ${TWILIO_ACCOUNT_SID:your-sid}
    auth-token: ${TWILIO_AUTH_TOKEN:your-token}
    from-number: ${TWILIO_FROM:+1234567890}
    whatsapp-from: ${TWILIO_WHATSAPP_FROM:whatsapp:+14155238886}
  gemini:
    api-key: ${GEMINI_API_KEY:}
    url: https://generativelanguage.googleapis.com
    model: gemini-3.8-flash
  rate-limit:
    instant-capacity: ${RATE_LIMIT_INSTANT_CAPACITY:100}
    async-capacity: ${RATE_LIMIT_ASYNC_CAPACITY:200}
    manual-capacity: ${RATE_LIMIT_MANUAL_CAPACITY:300}
    window-seconds: ${RATE_LIMIT_WINDOW_SECONDS:60}
